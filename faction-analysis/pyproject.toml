[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faction-analysis"
version = "0.1.0"
description = "Faction analysis sidecar for Osprey"
requires-python = ">=3.14"
dependencies = [
    "clickhouse-connect>=0.8.0",
    "igraph>=1.0.0",
    "joblib>=1.4",
    "leidenalg>=0.11.0",
    "numpy>=2.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "pandas>=2.2",
    "scikit-learn>=1.7",
    "typesafe-sdk>=0.7,<0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.9",
    "ty",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 120
fix = true

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B006",
]
ignore = [
    "E501",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: tests that need a live ClickHouse (gated on FACTION_ANALYSIS_INTEGRATION_CH_HOST)",
]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.14"
